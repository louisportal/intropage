<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site officiel de Louis Portal, conseiller des Français de l'étranger en Suisse">
    <title>Louis Portal</title>
    <link rel="stylesheet" href="home.css">
    <script src="consent.js"></script>
</head>
<body>

    <div class="lang-dropdown">
        <button class="lang-toggle" id="lang-toggle" onclick="toggleLangMenu()">🇫🇷</button>
        <div class="lang-menu" id="lang-menu">
            <a href="#" onclick="setLang('fr')">🇫🇷</a>
            <a href="#" onclick="setLang('en')">🇬🇧</a>
            <a href="#" onclick="setLang('de')">🇩🇪</a>
            <a href="#" onclick="setLang('it')">🇮🇹</a>
        </div>
    </div>

    <header>
        <h1>Louis Portal</h1>
    </header>

    <main>
        <p class="welcome" id="welcome-text">bienvenue sur ma page web</p>

        <div class="cards">
            <a href="fr/elu.html" id="card-elu" class="card card-consulaire">
                <span class="card-label" id="label-elu">Votre élu</span>
            </a>
            <a href="fr/elu_2021.html" id="card-activite" class="card card-activite">
                <span class="card-label" id="label-activite">Mon activité</span>
            </a>
            <a href="fr/liens-utiles.html" id="card-liens" class="card card-liens">
                <span class="card-label" id="label-liens">Liens Utiles</span>
            </a>
            <a href="fr/asfe.html" id="card-asfe" class="card card-asfe">
                <span class="card-label" id="label-asfe">L'ASFE et les conseillers</span>
            </a>
            <a href="fr/startup.html" id="card-startups" class="card card-startups">
                <span class="card-label" id="label-startups">Startups/invest</span>
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Louis Portal. All rights reserved.</p>
    </footer>

    <script>
        var flags = { fr: '🇫🇷', en: '🇬🇧', de: '🇩🇪', it: '🇮🇹' };
        var translations = {
            fr: { welcome: "bienvenue sur ma page web", elu: "Votre élu", activite: "Mon activité", liens: "Liens Utiles", asfe: "L'ASFE et les conseillers", startups: "Startups/invest" },
            en: { welcome: "welcome to my webpage", elu: "Your Councillor", activite: "My Activity", liens: "Useful Links", asfe: "ASFE and the Councillors", startups: "Startups/invest" },
            de: { welcome: "willkommen auf meiner Webseite", elu: "Ihr Ratsmitglied", activite: "Meine Aktivität", liens: "Nützliche Links", asfe: "Die ASFE und die Berater", startups: "Startups/invest" },
            it: { welcome: "benvenuti sulla mia pagina web", elu: "Il vostro Consigliere", activite: "La mia Attività", liens: "Link Utili", asfe: "L'ASFE e i Consiglieri", startups: "Startups/invest" }
        };

        // Auto-detect browser language on page load
        (function() {
            var userLang = navigator.language || navigator.userLanguage;
            var langCode = userLang.toLowerCase().substring(0, 2);
            var supportedLangs = ['fr', 'en', 'de', 'it'];

            // Default to French if language not supported
            if (supportedLangs.indexOf(langCode) === -1) {
                langCode = 'fr';
            }

            // Set the detected language
            setLang(langCode);
        })();

        function setLang(lang) {
            var t = translations[lang];
            document.getElementById('welcome-text').textContent = t.welcome;
            document.getElementById('label-elu').textContent = t.elu;
            document.getElementById('label-activite').textContent = t.activite;
            document.getElementById('label-liens').textContent = t.liens;
            document.getElementById('label-asfe').textContent = t.asfe;
            document.getElementById('label-startups').textContent = t.startups;
            document.getElementById('card-elu').href = lang + '/elu.html';
            document.getElementById('card-activite').href = lang + '/elu_2021.html';
            document.getElementById('card-liens').href = lang + '/liens-utiles.html';
            document.getElementById('card-asfe').href = lang + '/asfe.html';
            document.getElementById('card-startups').href = lang + '/startup.html';
            document.getElementById('lang-toggle').textContent = flags[lang];
            document.documentElement.lang = lang;
            closeLangMenu();
        }

        function toggleLangMenu() {
            document.getElementById('lang-menu').classList.toggle('open');
        }

        function closeLangMenu() {
            document.getElementById('lang-menu').classList.remove('open');
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.lang-dropdown')) {
                closeLangMenu();
            }
        });
    </script>

</body>
</html>
